name: Build and deploy ASP.Net Core app to Azure Web App - schink

concurrency:
  # Every branch/ref deploys to the same app and must share the same lock.
  group: schink-webapp-deployment
  # Never cancel a publish while the web app is stopped or files are being copied.
  cancel-in-progress: false

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      preflight_only:
        description: Validate the release and credentials without migrating or deploying
        type: boolean
        default: true

  schedule:
    # 00:00 UTC = 02:00 South Africa time
    - cron: '0 0 * * *'

env:
  AZURE_WEBAPP_NAME: schink
  AZURE_WEBAPP_RESOURCE_GROUP: Schink_Stories
  DOTNET_VERSION: '10.0.201'
  PROJECT_PATH: Shink/Shink.csproj
  PUBLISH_DIR: ./publish
  SUPABASE_PROJECT_REF: btpsoyiyhtfbeznonygn
  SUPABASE_WORKDIR: Shink/Database
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Verify deployment planning
        run: node --test scripts/tests/test_plan_webapp_publish.cjs

      - name: Verify deployment safety
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: Shink/Shink.csproj

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} -m

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore -m -p:RunAnalyzers=false

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v5

      - name: Verify deployment planning
        run: node --test scripts/tests/test_plan_webapp_publish.cjs

      - name: Verify deployment safety
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Check whether publish is needed
        id: publish_check
        uses: actions/github-script@v8
        with:
          script: |
            const { createPublishPlan } = require(`${process.env.GITHUB_WORKSPACE}/scripts/plan_webapp_publish.cjs`);
            const plan = await createPublishPlan(github, context);
            core.setOutput('should_publish', plan.shouldPublish ? 'true' : 'false');
            core.setOutput('migration_files', plan.migrationFiles.join('\n'));
            core.setOutput('reason', plan.reason);
            core.info(`Azure deployment baseline: ${plan.baselineSha} (run ${plan.baselineRunId})`);
            core.info(`Pending migration candidates: ${plan.migrationFiles.join(', ') || 'none'}`);

      - name: Stop when publish is not needed
        if: steps.publish_check.outputs.should_publish != 'true'
        run: |
          echo "Skipping publish: ${{ steps.publish_check.outputs.reason }}"

      - name: Set up .NET
        if: steps.publish_check.outputs.should_publish == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: Shink/Shink.csproj

      - name: Restore
        if: steps.publish_check.outputs.should_publish == 'true'
        run: dotnet restore ${{ env.PROJECT_PATH }} -m

      - name: Publish
        if: steps.publish_check.outputs.should_publish == 'true'
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release --no-restore -m -p:RunAnalyzers=false -o ${{ env.PUBLISH_DIR }}

      - name: Set up Supabase CLI
        if: steps.publish_check.outputs.should_publish == 'true' && steps.publish_check.outputs.migration_files != ''
        uses: supabase/setup-cli@v2
        with:
          version: 2.107.0
          github-token: ${{ github.token }}

      - name: Validate Supabase secrets
        if: steps.publish_check.outputs.should_publish == 'true' && steps.publish_check.outputs.migration_files != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Link Supabase project
        if: steps.publish_check.outputs.should_publish == 'true' && steps.publish_check.outputs.migration_files != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase --workdir ${{ env.SUPABASE_WORKDIR }} link --project-ref ${{ env.SUPABASE_PROJECT_REF }}

      - name: Login to Azure
        if: steps.publish_check.outputs.should_publish == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_382E49E8F4F44C09B8B1643442569987 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B343151D44E14C93ABB87BAEB6C36BA8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_527F5D2CBC94404AB0EB40F3F327EF21 }}

      - name: Verify Azure deployment prerequisites
        if: steps.publish_check.outputs.should_publish == 'true'
        run: |
          site_state="$(az webapp show --resource-group "$AZURE_WEBAPP_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query state -o tsv)"
          scm_stopped="$(az webapp show --resource-group "$AZURE_WEBAPP_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query scmSiteAlsoStopped -o tsv)"
          test "$site_state" = Running
          test "$scm_stopped" = false

      - name: Check and apply Supabase migrations
        if: steps.publish_check.outputs.should_publish == 'true' && steps.publish_check.outputs.migration_files != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MIGRATION_FILES: ${{ steps.publish_check.outputs.migration_files }}
          GITHUB_SHA: ${{ github.sha }}
          PREFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only }}
        run: |
          set -euo pipefail

          if [ "$PREFLIGHT_ONLY" != true ]; then
            supabase --workdir "${{ env.SUPABASE_WORKDIR }}" db query --linked \
              "create schema if not exists supabase_migrations;
              create table if not exists supabase_migrations.shink_action_migrations (
                file_name text primary key,
                github_sha text not null,
                applied_at timestamptz not null default now()
              );"
          fi

          while IFS= read -r migration_file; do
            if [ -z "$migration_file" ]; then
              continue
            fi

            migration_name="$(basename "$migration_file")"
            migration_path="$GITHUB_WORKSPACE/$migration_file"
            if [ ! -f "$migration_path" ]; then
              echo "::error::Migration file not found: $migration_path"
              exit 1
            fi

            migration_name_sql="${migration_name//\'/\'\'}"
            migration_version="${migration_name%%_*}"
            migration_slug="${migration_name#*_}"
            migration_slug="${migration_slug%.sql}"
            migration_version_sql="${migration_version//\'/\'\'}"
            migration_slug_sql="${migration_slug//\'/\'\'}"
            already_applied="$(
              supabase --workdir "${{ env.SUPABASE_WORKDIR }}" db query --linked --output csv \
                "select exists(select 1 from supabase_migrations.shink_action_migrations where file_name = '$migration_name_sql')
                  or exists(select 1 from supabase_migrations.schema_migrations
                    where version = '$migration_version_sql' and name = '$migration_slug_sql') as already_applied;" |
              tail -n 1 |
              tr -d '\r'
            )"

            case "$already_applied" in
              true)
                echo "Skipping previously applied migration: $migration_name"
                continue
                ;;
              false) ;;
              *)
                echo "::error::Unexpected migration history result for $migration_name: $already_applied"
                exit 1
                ;;
            esac

            if [ "$PREFLIGHT_ONLY" = true ]; then
              echo "Pending Supabase migration (preflight only): $migration_name"
              continue
            fi

            echo "Applying Supabase migration: $migration_name"
            supabase --workdir "${{ env.SUPABASE_WORKDIR }}" db query --linked --file "$migration_path"
            supabase --workdir "${{ env.SUPABASE_WORKDIR }}" db query --linked \
              "insert into supabase_migrations.shink_action_migrations(file_name, github_sha) values ('$migration_name_sql', '$GITHUB_SHA');"
          done <<< "$MIGRATION_FILES"

      - name: Verify account deletion cleanup
        if: steps.publish_check.outputs.should_publish == 'true' && contains(steps.publish_check.outputs.migration_files, 'account_deletion') && !(github.event_name == 'workflow_dispatch' && inputs.preflight_only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase --workdir "${{ env.SUPABASE_WORKDIR }}" db query --linked \
            --file "$GITHUB_WORKSPACE/Shink/Database/tests/account_personal_data_deletion.sql"

      - name: Package verified publish output
        if: steps.publish_check.outputs.should_publish == 'true'
        working-directory: ${{ env.PUBLISH_DIR }}
        run: zip -q -r "$GITHUB_WORKSPACE/webapp.zip" .

      - name: Stage, validate, and activate with automatic rollback
        if: steps.publish_check.outputs.should_publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.preflight_only)
        timeout-minutes: 25
        run: bash scripts/deploy-webapp-quiesced.sh "$AZURE_WEBAPP_RESOURCE_GROUP" "$AZURE_WEBAPP_NAME" "$GITHUB_WORKSPACE/webapp.zip" --state-file "$RUNNER_TEMP/schink-deployment-job.json"

      - name: Recover interrupted activation
        if: always() && steps.publish_check.outputs.should_publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.preflight_only)
        timeout-minutes: 15
        run: python3 scripts/deploy_webapp.py --recover "$RUNNER_TEMP/schink-deployment-job.json"

      - name: Verify public service health
        if: success() && steps.publish_check.outputs.should_publish == 'true'
        run: |
          response="$(curl --fail --silent --show-error --max-time 30 --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' -A 'Schink-Deployment-Health/1.0' https://www.schink.co.za/healthz)"
          test "$response" = ok
